name: Generate Pacman

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generate Arcade Snake
        # We use the Working Robot (Platane) but color it like Pacman
        uses: Platane/snk@v3
        with:
          # This is the correct input name for this robot:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-style.svg?color_snake=#FFD700&color_dots=#0D1117,#191970,#4B0082,#8A2BE2,#FF00FF

      - name: Push to Output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
